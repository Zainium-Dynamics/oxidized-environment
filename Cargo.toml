[workspace]
members = ["crates/oxidized-environment-core"]

[package]
name = "oxidized-environment"
version = "1.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Ali Zain <alizain.x404@gmail.com>"]
description = "Zainium OS environment resolver — CLI. One schema (oxienv.toml), one binary: anything that can't link Rust reads/writes it through this. quantra (PID 1) and quantra-ctl link oxidized-environment-core directly instead — this crate's clap dependency has no business in a boot-critical binary."
keywords = ["zainium", "environment", "init", "profile"]
categories = ["os", "config"]

[[bin]]
name = "oxidized-environment"
path = "src/main.rs"

[dependencies]
oxidized-environment-core = { path = "crates/oxidized-environment-core" }
clap = { version = "4", features = ["derive", "env"] }

# .cargo/config.toml (consumers set this) targets x86_64-zainium-linux-musl.
# For native check: cargo check --target x86_64-unknown-linux-gnu
