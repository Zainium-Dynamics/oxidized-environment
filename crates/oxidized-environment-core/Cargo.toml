[package]
name = "oxidized-environment-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Ali Zain <alizain.x404@gmail.com>"]
description = "Zainium OS environment resolver — library only. See the oxidized-environment crate for the CLI. Depends on nothing but toml, so PID 1 (quantra) can link it without pulling in a CLI parser."
keywords = ["zainium", "environment", "init", "profile"]
categories = ["os", "config"]

[lib]
name = "oxidized_environment"
path = "src/lib.rs"

[dependencies]
toml = "0.8"
